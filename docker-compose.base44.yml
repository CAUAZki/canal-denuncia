name: canal-seguro-ia

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: canal
      POSTGRES_PASSWORD: canal_dev_local
      POSTGRES_DB: canal_seguro
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canal -d canal_seguro"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: node:22-alpine
    working_dir: /workspace
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "8000"
      DATABASE_URL: postgres://canal:canal_dev_local@db:5432/canal_seguro
      SESSION_SECRET: canal-seguro-ia-dev-session
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    volumes:
      - "${BASE44_PROJECT_ROOT:-.}:/workspace"
      - app_node_modules:/workspace/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && node server/db/migrate.js && node server/db/seed.js && exec node --watch server/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: node:22-alpine
    working_dir: /workspace
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://api:8000
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
    ports:
      - "3000:3000"
    volumes:
      - "${BASE44_PROJECT_ROOT:-.}:/workspace"
      - app_node_modules:/workspace/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    labels:
      base44.project: "Canal Seguro IA"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  db_data:
  app_node_modules:
